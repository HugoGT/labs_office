<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oficina Virtual — Prototipo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: system-ui, 'Segoe UI', Cantarell, 'Noto Sans', 'DejaVu Sans', sans-serif; }
  #game { position: absolute; inset: 0; }
  canvas { image-rendering: pixelated; }

  .chip {
    position: fixed; z-index: 10; color: #e5e7eb; background: #111827ee;
    border: 1px solid #2b3444; border-radius: 12px; padding: 8px 14px;
    font-size: 13px; user-select: none;
  }
  #brand { top: 14px; left: 14px; font-weight: 600; }
  #brand span { color: #4ade80; }
  #help { top: 14px; left: 50%; transform: translateX(-50%); color: #9ca3af; font-size: 12px; }

  #recbadge {
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: #7f1d1dee; color: #fecaca; border: 1px solid #b91c1c; border-radius: 10px;
    padding: 6px 12px; font-size: 12px; font-weight: 600; display: none; align-items: center; gap: 8px;
  }
  #recbadge .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  #bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: #111827f2; border: 1px solid #2b3444; border-radius: 16px;
    padding: 10px 16px; color: #e5e7eb; box-shadow: 0 8px 30px #0009;
  }
  #me { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; padding-right: 10px; border-right: 1px solid #2b3444; }
  #me .st { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; }
  .btn {
    background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: #2b3444; }
  .btn.off { background: #7f1d1d; border-color: #b91c1c; color: #fecaca; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.rec-on { background: #b91c1c; border-color: #ef4444; color: #fff; }
  #status { font-size: 12px; color: #9ca3af; padding-left: 10px; border-left: 1px solid #2b3444; max-width: 340px; }
  #status b { color: #4ade80; font-weight: 600; }
  #nearby { display: flex; gap: 6px; flex-wrap: wrap; max-width: 300px; }
  #nearby .p {
    background: #14532d; color: #bbf7d0; border-radius: 999px; padding: 3px 10px; font-size: 11px;
  }

  #ctxmenu {
    position: fixed; z-index: 30; display: none; min-width: 190px;
    background: #111827; border: 1px solid #374151; border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 40px #000c;
  }
  #ctxmenu .hd { padding: 10px 14px; font-size: 13px; font-weight: 600; color: #e5e7eb; background: #1f2937; display: flex; align-items: center; gap: 8px; }
  #ctxmenu .hd .st { width: 8px; height: 8px; border-radius: 50%; }
  #ctxmenu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: #d1d5db; padding: 10px 14px; font-size: 13px; cursor: pointer;
  }
  #ctxmenu button:hover { background: #2b3444; color: #fff; }

  #toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 25;
    background: #111827f2; border: 1px solid #374151; color: #e5e7eb; border-radius: 12px;
    padding: 10px 16px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 70vw; text-align: center;
  }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="brand" class="chip">🏢 Oficina <span>Virtual</span> — prototipo Fase 0</div>
  <div id="help" class="chip">WASD / flechas para moverte · clic en un avatar para interactuar</div>

  <div id="recbadge"><span class="dot"></span> REC — Grabando esta sala (todos los participantes son notificados)</div>

  <div id="bar">
    <div id="me"><span class="st"></span> HugoGT</div>
    <button id="btnMic" class="btn">🎙️ Mic</button>
    <button id="btnCam" class="btn">📷 Cámara</button>
    <button id="btnRec" class="btn" disabled title="Solo disponible dentro de una sala">⏺ Grabar</button>
    <div id="status">Audio por <b>proximidad</b></div>
    <div id="nearby"></div>
  </div>

  <div id="ctxmenu"></div>
  <div id="toast"></div>

  <script src="js/phaser.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
