# Sin `packages:` a proposito: esto no es un monorepo. El fichero existe por las
# dos claves de abajo, que en pnpm 11 ya no se leen desde package.json.

# @colyseus/core 0.16.25 esta publicado roto: su manifiesto declara
# `@colyseus/greeting-banner@workspace:^`, es decir, el protocolo `workspace:`
# se filtro al publicar y pnpm lo rechaza con ERR_PNPM_WORKSPACE_PKG_NOT_FOUND.
# 0.16.24 es la ultima sana de la linea 0.16, y hay que quedarse en 0.16 porque
# no existe cliente JS para el servidor 0.17 (ver server/README.md).
overrides:
  "@colyseus/core": 0.16.24

# msgpackr-extract es el acelerador nativo opcional de msgpackr. No se compila a
# proposito: msgpackr cae a su implementacion en JS sin perder correccion, y asi
# CI no necesita toolchain de compilacion nativa.
allowBuilds:
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - livekit-client@2.22.3
