# Stack self-hosted de audio/video para la Fase 0 (PRD 6.3 y 6.5).
#
#   livekit   SFU: reparte los streams (no P2P — P2P no pasa de ~6 por sala)
#   egress    graba una sala a MP4 y la sube a MinIO
#   minio     almacenamiento S3-compatible propio para las grabaciones
#   redis     canal de control entre livekit y egress (egress lo necesita)
#
# Arranque:  docker compose up -d
# Estado:    docker compose ps

name: oficina-virtual-av

services:
  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [av]

  livekit:
    image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    command: --config /etc/livekit.yaml
    environment:
      # Formato que espera LiveKit: "clave: secreto"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"                 # HTTP / WebSocket (senalizacion)
      - "7881:7881"                 # RTC sobre TCP (fallback tras firewall)
      - "50000-50019:50000-50019/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks: [av]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"                 # API S3
      - "9001:9001"                 # consola web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [av]

  # Crea el bucket de grabaciones y termina. No es un servicio permanente.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$MINIO_BUCKET\" &&
      mc ls local &&
      echo 'bucket listo'
      "
    restart: "no"
    networks: [av]

  egress:
    image: livekit/egress:v1.14.1@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: true
        s3:
          access_key: ${MINIO_ROOT_USER}
          secret: ${MINIO_ROOT_PASSWORD}
          region: us-east-1
          endpoint: http://minio:9000
          bucket: ${MINIO_BUCKET}
          force_path_style: true
        log_level: info
    # Egress corre un Chrome headless para componer la sala; necesita SYS_ADMIN
    # para su sandbox y bastante /dev/shm o el navegador muere al renderizar.
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [av]

volumes:
  minio-data:

networks:
  av:
    driver: bridge
