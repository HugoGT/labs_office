# Stack self-hosted de audio/video para la Fase 0 (PRD 6.3 y 6.5).
#
#   livekit   SFU: reparte los streams (no P2P — P2P no pasa de ~6 por sala)
#   egress    records a room to MP4 and uploads it to a Google Cloud Storage
#             dev bucket (issues #5, #58). There is no GCS emulator Egress can
#             upload to, so local recording needs a real bucket and an ADC
#             file: GCS_CREDENTIALS_FILE in .env (see README.md)
#   redis     canal de control entre livekit y egress (egress lo necesita)
#
# Arranque:  docker compose up -d
# Estado:    docker compose ps

name: oficina-virtual-av

services:
  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [av]

  livekit:
    image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    command: --config /etc/livekit.yaml
    environment:
      # Formato que espera LiveKit: "clave: secreto"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"                 # HTTP / WebSocket (senalizacion)
      - "7881:7881"                 # RTC sobre TCP (fallback tras firewall)
      - "50000-50019:50000-50019/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks: [av]

  egress:
    image: livekit/egress:v1.14.1@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: true
        log_level: info
      # The upload target (bucket and key) travels in each request, with no
      # credentials: Egress then uses Application Default Credentials, which
      # here is the ADC file mounted below. On the GCE VM the same
      # request uses the VM service account instead.
      GOOGLE_APPLICATION_CREDENTIALS: /etc/egress/gcs-key.json
    volumes:
      # Unset GCS_CREDENTIALS_FILE mounts /dev/null: the stack still starts
      # (the audio spike does not record), and only an upload fails.
      - ${GCS_CREDENTIALS_FILE:-/dev/null}:/etc/egress/gcs-key.json:ro
    # Egress corre un Chrome headless para componer la sala; necesita SYS_ADMIN
    # para su sandbox y bastante /dev/shm o el navegador muere al renderizar.
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [av]

networks:
  av:
    driver: bridge
