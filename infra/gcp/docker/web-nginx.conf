# Configuracion del contenedor `web`. Solo sirve ficheros por la red interna
# del compose; Caddy es quien habla con internet, termina TLS y comprime.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite pone el hash del contenido en el nombre de cada fichero de /assets/,
    # asi que un fichero con ese nombre nunca cambia y se puede cachear para
    # siempre. Es lo que evita reenviar el chunk de Phaser (~1.2 MB) en cada
    # visita.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html SI tiene que revalidarse siempre: es el unico fichero cuyo
    # nombre no cambia, y es el que apunta a los assets nuevos tras un
    # despliegue. Cachearlo dejaria a los navegadores pidiendo assets borrados.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # La aplicacion resuelve sus propias rutas en el cliente: cualquier ruta
    # desconocida devuelve el index en vez de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
