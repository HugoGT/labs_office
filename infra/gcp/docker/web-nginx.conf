# Configuracion del contenedor `web`. Solo sirve ficheros por la red interna
# del compose; Caddy es quien habla con internet, termina TLS y comprime.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite pone el hash del contenido en el nombre de cada fichero de /assets/,
    # asi que un fichero con ese nombre nunca cambia y se puede cachear para
    # siempre. Es lo que evita reenviar el chunk de Phaser (~1.2 MB) en cada
    # visita.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The art pack (public/assets/pack/) shares that prefix but keeps stable
    # names, so it must revalidate: cached as immutable, a new `pnpm art:export`
    # would never reach a browser that already visited. nginx answers 304 from
    # the ETag while nothing changed. Guarded by src/game/artPackCaching.node.test.ts.
    location /assets/pack/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html SI tiene que revalidarse siempre: es el unico fichero cuyo
    # nombre no cambia, y es el que apunta a los assets nuevos tras un
    # despliegue. Cachearlo dejaria a los navegadores pidiendo assets borrados.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA (#13). The service worker is how a deploy reaches an installed app:
    # served from the HTTP cache, the browser would compare the old worker with
    # itself and keep the old build. The manifest and the icons keep stable
    # names too. `try_files ... =404` so a missing file is a 404, never the
    # index.html of `location /` (a worker script that is HTML fails to
    # register; a manifest that is HTML breaks installation). Guarded by
    # tools/pwa/pwaCaching.test.ts.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # La aplicacion resuelve sus propias rutas en el cliente: cualquier ruta
    # desconocida devuelve el index en vez de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
