# Topologia de la VM de despliegue (issue #3). Vive en /opt/office/ y lo
# escribe ahi `office-deploy` desde la metadata de la instancia.
#
#   caddy      unico proceso con los puertos 80/443. Termina TLS y reparte
#   web        el SPA ya construido, servido como ficheros estaticos
#   colyseus   el servidor de Node: salas, /health, /livekit/token y /admin/*
#   livekit    el SFU
#   postgres   el directorio de usuarios e invitaciones (issue #24)
#
# Postgres es un contenedor mas en esta misma VM y no Cloud SQL. La instancia
# mas barata de Cloud SQL cuesta mas que la VM entera y habria traido red
# privada, IAM y mas Terraform para guardar unos centenares de filas. El precio
# de la decision esta anotado y es real: las copias de seguridad son manuales y
# la durabilidad del dato es la del disco de la VM (ver README).
#
# NO hay Redis, a diferencia de infra/livekit/docker-compose.yml. LiveKit solo
# necesita Redis para coordinar varios nodos entre si y para hablar con Egress;
# aqui hay un unico nodo y la grabacion esta aplazada al issue #5, asi que
# Redis no coordinaria nada. Vuelve a hacer falta el dia que se despliegue
# Egress o un segundo SFU.
#
# Las variables salen de /opt/office/.env, que `office-deploy` regenera en cada
# despliegue con los secretos recien leidos de Secret Manager.

name: labs-office

# Sin limite de log, los ficheros de Docker se comen el disco de 20 GB en
# semanas y la VM muere por espacio, no por carga.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *logging
    environment:
      APP_HOST: "${APP_HOST}"
      LK_HOST: "${LK_HOST}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Volumen con nombre y no bind: aqui viven las claves privadas de los
      # certificados y el estado de la cuenta ACME. Perderlo obliga a reemitir,
      # y reemitir cuenta contra el limite compartido de sslip.io (ver README).
      # LiveKit lo monta en solo lectura para leer el certificado de lk.
      - caddy-data:/data
      - caddy-config:/config
    # LiveKit corre en la red del host (ver mas abajo), asi que Caddy no puede
    # alcanzarlo por nombre de servicio: necesita la puerta del bridge.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - colyseus
    networks: [office]

  web:
    image: "${REGISTRY}/web:${IMAGE_TAG}"
    restart: unless-stopped
    logging: *logging
    # Sin `ports`: solo Caddy le habla, por la red interna del compose.
    networks: [office]

  colyseus:
    image: "${REGISTRY}/colyseus:${IMAGE_TAG}"
    restart: unless-stopped
    logging: *logging
    environment:
      PORT: "2567"
      # El servidor es la fuente de verdad de esta URL: la devuelve en la
      # respuesta de /livekit/token y el cliente la usa tal cual
      # (src/game/livekitEndpoint.ts). Por eso NO se hornea en el bundle del SPA.
      LIVEKIT_URL: "wss://${LK_HOST}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      # Issue #8. Vacia: el servidor no exige autenticacion, igual que antes.
      # Con el id del proyecto de Identity Platform: falla cerrado y solo entran
      # los que traen un ID token valido. `GET /health` dice en cual de los dos
      # modos esta corriendo.
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      # Issue #24. Vacia: no hay directorio, el servidor se comporta igual que
      # antes y /admin/* responde que la funcion esta apagada. Con la cadena de
      # conexion: el servidor migra el esquema al arrancar y sirve el panel.
      # Misma convencion de degradacion que FIREBASE_PROJECT_ID, y `GET /health`
      # tambien dice en cual de los dos modos esta corriendo.
      DATABASE_URL: "${DATABASE_URL:-}"
      # El correo que se promociona a superadmin en su primer inicio de sesion,
      # y solo mientras no exista ya un superadmin. No es un secreto (es una
      # direccion de correo), asi que no pasa por Secret Manager, por lo mismo
      # que FIREBASE_PROJECT_ID: lo que protege la oficina es la verificacion
      # de la firma del ID token, no que este valor sea desconocido. Vacio: no
      # hay arranque en frio posible y el directorio se queda sin superadmin.
      BOOTSTRAP_SUPERADMIN_EMAIL: "${BOOTSTRAP_SUPERADMIN_EMAIL:-}"
      # Clave de cuenta de servicio con la que el servidor da de alta cuentas en
      # Identity Platform al aceptar una invitacion. Esta SI es un secreto y sale
      # de Secret Manager. Vacia: el resto del panel funciona y solo el endpoint
      # de invitar devuelve 503, que es la degradacion querida: la funcion es
      # opcional y no debe tumbar el despliegue.
      IDENTITY_ADMIN_CREDENTIALS: "${IDENTITY_ADMIN_CREDENTIALS:-}"
    # `depends_on` en forma de lista (la que usa caddy mas arriba) solo espera a
    # que el contenedor exista, no a que el servicio responda. Aqui no alcanza:
    # Postgres arranca su contenedor en milisegundos y tarda bastante mas en
    # aceptar conexiones, y el servidor corre las migraciones nada mas arrancar.
    # Sin la condicion, el primer arranque de la VM muere con un ECONNREFUSED
    # que `restart: unless-stopped` acaba tapando tras unos reinicios, o sea: un
    # arranque que funciona por casualidad y unos logs que no explican nada.
    depends_on:
      postgres:
        condition: service_healthy
    # Tampoco publica el 2567 al host: la unica entrada es Caddy sobre 443.
    networks: [office]

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    logging: *logging
    # Sin `ports`, por el mismo motivo que `web`: solo colyseus le habla, por la
    # red interna del compose. Publicar el 5432 lo dejaria escuchando en la IP
    # publica de la VM y dependiendo solo del firewall para no ser alcanzable.
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - office-db:/var/lib/postgresql/data
    # Lo que hace util la condicion `service_healthy` de colyseus. `pg_isready`
    # es el propio cliente de Postgres preguntando por el socket, no un `sleep`
    # disfrazado: devuelve 0 solo cuando el servidor acepta conexiones.
    # `start_period` cubre el primer arranque, que ademas inicializa el cluster.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [office]

  livekit:
    image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    restart: unless-stopped
    logging: *logging
    command: --config /etc/livekit.yaml
    # Red del host a proposito. Publicar el rango 50000-60000/udp con el
    # mecanismo normal de Docker crea una regla (y con el proxy en espacio de
    # usuario, un proceso) por puerto: el arranque tarda minutos y el consumo
    # de memoria es absurdo. Es el mismo problema que en la PoC obligo a
    # recortar el rango a 20 puertos, pero aqui la solucion es no publicar
    # nada y dejar que el SFU escuche directamente en la interfaz de la VM.
    # Efecto secundario querido: LiveKit ve la IP real del cliente, que es lo
    # que ICE necesita para elegir candidatos.
    network_mode: host
    environment:
      # Formato que espera LiveKit: "clave: secreto".
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      # Solo lectura: LiveKit toma de aqui el certificado que Caddy emitio para
      # el hostname lk.*, y lo usa para el TURN sobre TLS del puerto 5349.
      - caddy-data:/caddy-data:ro

volumes:
  caddy-data:
  caddy-config:
  # Aqui viven los usuarios, sus roles y las invitaciones. Perderlo NO es como
  # perder caddy-data: un certificado se vuelve a emitir solo, y esto no se
  # reemite desde ningun sitio. Borrar el volumen, o destruir la VM que lo
  # contiene, borra el directorio entero y deja la oficina sin superadmin hasta
  # que alguien vuelva a hacer el arranque en frio a mano. No hay copia
  # automatica: el README explica el `pg_dump` que hay que correr a mano.
  office-db:

networks:
  office:
    driver: bridge
