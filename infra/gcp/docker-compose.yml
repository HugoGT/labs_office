# Topologia de la VM de despliegue (issue #3). Vive en /opt/office/ y lo
# escribe ahi `office-deploy` desde la metadata de la instancia.
#
#   caddy      unico proceso con los puertos 80/443. Termina TLS y reparte
#   web        el SPA ya construido, servido como ficheros estaticos
#   colyseus   el servidor de Node: salas, /health, /livekit/token y /admin/*
#   livekit    el SFU
#   redis      control channel between livekit and egress (issue #5)
#   egress     records a space to MP4 and uploads it to GCS (issues #5, #58)
#
# The directory database is NOT here (issue #72). It used to be a `postgres`
# container on the VM boot disk, and a `terraform apply` that replaced the VM
# wiped it with no backup to restore from. It now lives in Cloud SQL
# (terraform/database.tf), reached over its private IP with TLS, with
# automated backups and point-in-time recovery. See "Directory database" in
# README.md.
#
# Redis and Egress arrive with recording (issue #5). LiveKit only needs Redis to
# talk to Egress (or to a second SFU node); Egress does not work without it.
# Egress uploads straight to the GCS recordings bucket with the VM service
# account (Application Default Credentials through the metadata server), so no
# storage key lives on this machine. Capacity: see "Recordings" in README.md.
#
# Las variables salen de /opt/office/.env, que `office-deploy` regenera en cada
# despliegue con los secretos recien leidos de Secret Manager.

name: labs-office

# Sin limite de log, los ficheros de Docker se comen el disco de 20 GB en
# semanas y la VM muere por espacio, no por carga.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # Imagen propia, construida por este repositorio desde el issue #19: la
    # oficial no trae el modulo layer4 que multiplexa TURN/TLS sobre el 443.
    # Mismo patron que `web` y `colyseus`, y con la misma trampa de
    # IMAGE_TAG documentada en office-deploy.sh.
    image: "${REGISTRY}/caddy:${IMAGE_TAG}"
    restart: unless-stopped
    logging: *logging
    environment:
      APP_HOST: "${APP_HOST}"
      LK_HOST: "${LK_HOST}"
      # Hostname dedicado del TURN (issue #19). Ver el bloque layer4 del
      # Caddyfile: es lo que permite separar TURN de la senalizacion mirando
      # solo el SNI, los dos sobre el mismo 443.
      TURN_HOST: "${TURN_HOST}"
      # A donde reenvia el mux el TURN ya con TLS terminado. LiveKit corre en
      # la red del host (ver mas abajo), de ahi `host.docker.internal`.
      TURN_UPSTREAM: "host.docker.internal:5349"
      # Vacia en produccion: esta linea desaparece al sustituir la variable y
      # el Caddyfile no gana ninguna opcion global de mas. La usa el arnes
      # local (infra/gcp/test/mux/) para forzar la CA interna de Caddy sin
      # tocar ni copiar este fichero.
      CADDY_GLOBAL_EXTRA: ""
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Volumen con nombre y no bind: aqui viven las claves privadas de los
      # certificados y el estado de la cuenta ACME. Perderlo obliga a reemitir,
      # y reemitir cuenta contra el limite compartido de sslip.io (ver README).
      # Issue #19: ya no lo monta ningun otro contenedor. LiveKit terminaba
      # TLS leyendo de aqui el certificado de lk.*; ahora Caddy termina el TLS
      # del TURN en el propio mux, asi que solo Caddy necesita estas claves.
      - caddy-data:/data
      - caddy-config:/config
    # LiveKit corre en la red del host (ver mas abajo), asi que Caddy no puede
    # alcanzarlo por nombre de servicio: necesita la puerta del bridge.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - colyseus
    networks: [office]

  web:
    image: "${REGISTRY}/web:${IMAGE_TAG}"
    restart: unless-stopped
    logging: *logging
    # Sin `ports`: solo Caddy le habla, por la red interna del compose.
    networks: [office]

  colyseus:
    image: "${REGISTRY}/colyseus:${IMAGE_TAG}"
    restart: unless-stopped
    logging: *logging
    environment:
      PORT: "2567"
      # El servidor es la fuente de verdad de esta URL: la devuelve en la
      # respuesta de /livekit/token y el cliente la usa tal cual
      # (src/game/livekitEndpoint.ts). Por eso NO se hornea en el bundle del SPA.
      LIVEKIT_URL: "wss://${LK_HOST}"
      # Issue #9. Mismo patron que LIVEKIT_URL arriba: APP_HOST ya lo escribe
      # office-deploy.sh en el .env generado, y aqui solo se interpola con el
      # esquema que un navegador realmente manda en su cabecera Origin.
      ALLOWED_ORIGIN: "https://${APP_HOST}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      # Issue #8. Vacia: el servidor no exige autenticacion, igual que antes.
      # Con el id del proyecto de Identity Platform: falla cerrado y solo entran
      # los que traen un ID token valido. `GET /health` dice en cual de los dos
      # modos esta corriendo.
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      # Issue #24. Vacia: no hay directorio, el servidor se comporta igual que
      # antes y /admin/* responde que la funcion esta apagada. Con la cadena de
      # conexion: el servidor migra el esquema al arrancar y sirve el panel.
      # Misma convencion de degradacion que FIREBASE_PROJECT_ID, y `GET /health`
      # tambien dice en cual de los dos modos esta corriendo. Since #72 it
      # points at the Cloud SQL private IP; office-deploy builds it.
      DATABASE_URL: "${DATABASE_URL:-}"
      # Cloud SQL only accepts TLS (issue #72). The server verifies the
      # instance against its own CA, which office-deploy writes from instance
      # metadata and is mounted below. Fixed path, not interpolated: the mount
      # and this value have to agree, so they live side by side.
      DATABASE_SSL_CA_FILE: /etc/office/db-server-ca.pem
      # El correo que se promociona a superadmin en su primer inicio de sesion,
      # y solo mientras no exista ya un superadmin. No es un secreto (es una
      # direccion de correo), asi que no pasa por Secret Manager, por lo mismo
      # que FIREBASE_PROJECT_ID: lo que protege la oficina es la verificacion
      # de la firma del ID token, no que este valor sea desconocido. Vacio: no
      # hay arranque en frio posible y el directorio se queda sin superadmin.
      BOOTSTRAP_SUPERADMIN_EMAIL: "${BOOTSTRAP_SUPERADMIN_EMAIL:-}"
      # Clave de cuenta de servicio con la que el servidor da de alta cuentas en
      # Identity Platform al aceptar una invitacion. Esta SI es un secreto y sale
      # de Secret Manager. Vacia: el resto del panel funciona y solo el endpoint
      # de invitar devuelve 503, que es la degradacion querida: la funcion es
      # opcional y no debe tumbar el despliegue.
      IDENTITY_ADMIN_CREDENTIALS: "${IDENTITY_ADMIN_CREDENTIALS:-}"
      # La alternativa sin clave a la variable de arriba: el servidor le pide el
      # token al servidor de metadata con la identidad de la VM. Existe porque
      # la organizacion puede tener prohibido crear claves de cuenta de
      # servicio. Vacia: misma degradacion de siempre (invitar responde 503).
      IDENTITY_ADMIN_USE_METADATA: "${IDENTITY_ADMIN_USE_METADATA:-}"
      # Recording (issues #5, #58). LIVEKIT_URL above is the PUBLIC wss URL for
      # browsers; the Egress API is reached directly over the bridge gateway,
      # since LiveKit runs on the host network (see `livekit` below).
      LIVEKIT_API_URL: "http://host.docker.internal:7880"
      # Empty: /recordings/* answers 503 recording-not-configured and the rest
      # of the office works as before. Not a secret: a bucket name. The
      # credentials are the VM service account, through the metadata server.
      RECORDING_GCS_BUCKET: "${RECORDING_GCS_BUCKET:-}"
    volumes:
      # The CA is public (it proves the server, it grants nothing), hence a
      # plain read-only bind mount and not a secret.
      - ./db-server-ca.pem:/etc/office/db-server-ca.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No `depends_on` on the database any more: Cloud SQL is not a service of
    # this compose. If it is unreachable at startup the migration fails with a
    # clear error and `restart: unless-stopped` retries.
    # Tampoco publica el 2567 al host: la unica entrada es Caddy sobre 443.
    networks: [office]

  livekit:
    # v1.13.7, no v1.13.5: turn.proxy_protocol / proxy_protocol_trusted_cidrs
    # (issue #19) solo existen desde v1.13.7 (commit adf44a2e, 2026-09-09,
    # publicado en el tag el 2026-09-14). v1.13.5 ignora en SILENCIO cualquier
    # clave de livekit.yaml.tpl que no reconoce, asi que subir esta version es
    # obligatorio en el MISMO commit que anade esas dos claves: escribirlas
    # antes de esta linea seria una trampa de fallo silencioso, no un error.
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    restart: unless-stopped
    logging: *logging
    command: --config /etc/livekit.yaml
    # Red del host a proposito. Publicar el rango 50000-60000/udp con el
    # mecanismo normal de Docker crea una regla (y con el proxy en espacio de
    # usuario, un proceso) por puerto: el arranque tarda minutos y el consumo
    # de memoria es absurdo. Es el mismo problema que en la PoC obligo a
    # recortar el rango a 20 puertos, pero aqui la solucion es no publicar
    # nada y dejar que el SFU escuche directamente en la interfaz de la VM.
    # Efecto secundario querido: LiveKit ve la IP real del cliente, que es lo
    # que ICE necesita para elegir candidatos.
    network_mode: host
    environment:
      # Formato que espera LiveKit: "clave: secreto".
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # LiveKit reads `redis.address: 127.0.0.1:6379` (livekit.yaml.tpl) and
    # refuses to start without it once the section exists.
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    logging: *logging
    # Pure message bus between LiveKit and Egress: nothing to persist.
    command: redis-server --save "" --appendonly no
    # Published on loopback ONLY: LiveKit runs on the host network and cannot
    # use the service name. Never on 0.0.0.0, where the firewall would be the
    # only thing keeping an unauthenticated Redis off the internet.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [office]

  egress:
    # Same pin as infra/livekit/docker-compose.yml, where it was validated.
    image: livekit/egress:v1.14.1@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
    restart: unless-stopped
    logging: *logging
    environment:
      # No storage section: the upload target (bucket and key) travels in
      # every request (server/src/recording/egressPort.ts), and with no
      # credentials in it Egress uses the VM service account through the
      # metadata server.
      #
      # cpu_cost: Egress admits a request only if
      #   cores * max_cpu_utilization (0.8) - in use >= cost,
      # and the default room composite cost is 4, which no VM under 6 vCPU can
      # ever satisfy: every start would answer 502 egress-failed. 3 admits ONE
      # recording on 4 vCPU (e2-standard-4: 3.2 >= 3) and none on the default
      # e2-medium (1.6), which is the intent: a headless Chrome encoding video
      # on 2 shared vCPUs would starve the SFU and degrade every live call.
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://host.docker.internal:7880
        insecure: true
        cpu_cost:
          room_composite_cpu_cost: 3
        log_level: info
    # Egress runs a headless Chrome to compose the room: SYS_ADMIN for its
    # sandbox and a large /dev/shm, or the browser dies while rendering.
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [office]

volumes:
  # Issue #19: LiveKit ya NO monta este volumen. Terminaba TLS leyendo el
  # certificado de lk.* de aqui, con acceso de solo lectura a las claves
  # privadas de TODOS los hostnames de Caddy, no solo al suyo; ahora Caddy
  # termina el TLS del TURN en el mux y le entrega texto claro con PROXY v2
  # (turn.external_tls en livekit.yaml.tpl), asi que ningun contenedor salvo
  # Caddy puede leer las claves de Caddy.
  caddy-data:
  caddy-config:
  # `office-db` is gone (issue #72): the directory lives in Cloud SQL. The old
  # volume stays on a VM that already had it until removed by hand (README).

networks:
  office:
    driver: bridge
    # Subred fijada a proposito (issue #19, D5). LiveKit necesita saber desde
    # que origenes puede aceptar una cabecera PROXY
    # (turn.proxy_protocol_trusted_cidrs en livekit.yaml.tpl) y Caddy le habla
    # desde su direccion de esta red. Sin fijarla, Docker elige la subred de
    # un pool y ese valor dejaria de cuadrar en la siguiente recreacion de la
    # red, en silencio. Coste aceptado: cambiar esta subred recrea la red y,
    # con ella, todos los contenedores.
    ipam:
      config:
        - subnet: 172.30.0.0/24
