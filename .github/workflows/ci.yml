name: CI

on:
  # Disparadores automaticos reactivados el 2026-09-21, cumpliendo la condicion
  # que dejo escrita la pausa del 2026-09-17: se pedian tres corridas verdes
  # seguidas por `workflow_dispatch` antes de descomentarlos, y hubo ocho
  # (`gh run list --workflow=ci.yml`), la ultima el 2026-09-19. Eso cubre la
  # duda que quedaba abierta: que `livekit-server --dev` con `--network host`
  # reune candidatos ICE alcanzables en un runner real.
  #
  # La otra objecion era la duracion. Tambien se midio: las corridas verdes van
  # entre 3m54s y 4m36s, con el `timeout-minutes: 20` de abajo muy lejos.
  #
  # `push` se acota a main y `pull_request` a los PR contra main: una rama de
  # trabajo con PR abierto se verifica una sola vez, no dos.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una ejecucion por rama: un push nuevo cancela el anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `actions: read` lets the push check below look up the artifacts and runs of
# earlier pull request runs.
permissions:
  contents: read
  actions: read

jobs:
  # A merged PR used to run this whole workflow twice: once on the PR and again
  # on the push to main, before deploy-test.yml could start. The PR run tests
  # `refs/pull/N/merge`; when main did not move before the merge, the commit on
  # main has that exact tree, so the second run would test the same bytes.
  # This job proves that from the tree the PR run records (the final `verify`
  # job) and lets every other job skip; a skipped job still leaves the workflow
  # green, which is what deploy-test.yml waits for. If main moved, or the check
  # cannot tell, every job runs as before. Fork runs never count:
  # tools/ci/testedTree.ts explains why.
  tested-tree:
    name: Skip if this tree already passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every step may fail without failing the job: a failed job would skip
    # the test jobs (implicit `success()` on `needs`) and leave main red with
    # nothing deployed, while an empty output just runs the full CI. The step
    # timeouts add up to well under the job's, because `continue-on-error`
    # covers a step that times out but not a job that does.
    outputs:
      tested: ${{ steps.check.outputs.tested }}

    steps:
      - name: Checkout the check
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci

      - name: Set up Node
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Look for a green pull request run of this tree
        id: check
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 1
        run: node tools/ci/skipTestedTree.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TREE_SHA: ${{ github.event.head_commit.tree_id }}

  # `test:all` took about 7 of the 10 minutes of a single job, so it runs as
  # four Vitest shards next to `build-e2e`. Each shard pays its own ~1 minute
  # of setup; the wall time becomes the slowest shard instead of the sum.
  # Files go to shards by their recorded time (tools/ci/testShards.ts), not
  # by Vitest's path hash, which once put a third of all test time in one.
  # Four, not three: the four OfficeScene browser files each need a shard of
  # their own. Two of them in one shard fight for the runner's CPU and took
  # 199 s and 166 s there, against 57 s for one alone.
  tests:
    name: Tests (shard ${{ matrix.shard }}/4)
    needs: tested-tree
    if: needs.tested-tree.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A red shard does not cancel the others, so one run reports every
      # failing file instead of the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La version de pnpm sale del campo packageManager de package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # La capa `browser` corre contra Chromium real: Phaser no se puede ni
      # importar bajo jsdom, asi que sin este navegador esa capa no existe.
      - name: Install Chromium for the browser test layer
        run: pnpm exec playwright install --with-deps chromium

      # Tres capas: `unit` (jsdom), `server` (Node, levanta un Colyseus real en
      # un puerto efimero) y `browser` (Chromium). `test:all` corre las tres.
      # CI always starts with a cold Vite cache, so a dependency the `browser`
      # project discovers mid-run shows up here as a reload that breaks
      # in-flight test imports (#196). Fail on it even when the tests survive,
      # and add the dependency to that project's `optimizeDeps.include`. Every
      # shard checks its own log: each one starts cold and discovers its own
      # files' dependencies.
      - name: Tests (jsdom + Node + Chromium)
        run: |
          set -o pipefail
          pnpm test:all --shard=${{ matrix.shard }}/4 2>&1 | tee test-all.log
          if grep -q 'optimized dependencies changed' test-all.log; then
            echo "::error::Vite re-optimized dependencies mid-run; add them to optimizeDeps.include of the browser project in vite.config.ts"
            exit 1
          fi

  build-e2e:
    name: Typecheck, build and E2E
    needs: tested-tree
    if: needs.tested-tree.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The E2E layers below drive two real Chromium clients.
      - name: Install Chromium for the E2E layers
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      # Pruebas puras del arnes E2E (extraccion de la URL de `vite preview`).
      # Van antes de los builds a proposito: no necesitan bundle y cuestan
      # milisegundos, asi que un arnes roto se ve en el minuto 1 y no tras los
      # dos builds y diez escenarios de navegador.
      - name: Harness unit tests
        run: pnpm test:harness

      - name: Build
        run: pnpm build

      # Segundo build, solo para el arnes E2E: expone el hook de test-only
      # detras de un flag (`__OFFICE_E2E__`), el `dist` de arriba se queda
      # limpio y sirve de control negativo.
      - name: Build the instrumented E2E bundle
        run: pnpm build:e2e

      # Dos clientes reales de Chromium contra Colyseus real y `vite preview`
      # real; LiveKit va sin credenciales a proposito (D6), asi que esta capa
      # no necesita Docker.
      #
      # No se desactiva el color: con `CI` definido vite colorea su banner
      # (issue #22), y dejarlo asi hace que este paso ejercite de verdad la ruta
      # con secuencias ANSI en vez de esconderla detras de `NO_COLOR`.
      # El plazo sube a 30s porque un runner frio arranca `node` y `vite` mas
      # despacio que una maquina local; el arnes usa 15s por defecto.
      - name: Two-client E2E (Colyseus + preview, no LiveKit)
        run: pnpm test:e2e
        env:
          E2E_READINESS_TIMEOUT_MS: 30000

      # D7: `--network host` puts the SFU and this same runner process in one
      # network namespace. `use_external_ip: false` (`infra/livekit/livekit.yaml`)
      # makes LiveKit advertise ICE candidates that are only reachable this way
      # on a GitHub-hosted runner -- a bridged `docker compose` network or the
      # unmodified `services:` block would advertise an address Chromium can
      # never actually reach (obs #562 Q3). Same digest-pinned image as
      # `infra/livekit/docker-compose.yml:25`, one version-pin surface.
      - name: Start a real LiveKit server for the audio E2E gate
        run: |
          docker run -d --network host --name ci-livekit \
            livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1 \
            --dev

      # `--dev` mints its own fixed `devkey`/`secret` pair -- never a real
      # secret, so no GitHub Secret is needed. Written to the already
      # gitignored `.gitignore:11-15` path; deleted again in the cleanup step
      # below regardless of job outcome.
      - name: Write ephemeral LiveKit credentials for the audio E2E gate
        run: |
          cat > infra/livekit/.env <<'EOF'
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=secret
          LIVEKIT_URL=ws://localhost:7880
          EOF

      # Blocking, never `continue-on-error` (D9): an advisory gate cannot
      # fail, which is the exact vacuity this change exists to remove -- and
      # it already caught a real product bug (obs #570) this way. The harness
      # itself gates on a real readiness probe (`livekitHealthUrl`) before
      # opening any browser context, so this step needs no extra wait.
      - name: Two-client audio E2E (real LiveKit, both arrival orders)
        run: pnpm test:e2e:audio
        env:
          VITE_LIVEKIT_E2E: 1
          E2E_READINESS_TIMEOUT_MS: 30000

      - name: Stop the real LiveKit server and drop its credentials
        if: always()
        run: |
          docker rm -f ci-livekit || true
          rm -f infra/livekit/.env

  # Last on purpose: `needs` lists every job that tests the tree, so this job
  # runs only when all of them passed. The empty artifact's name is the proof
  # the `tested-tree` job looks for on main; a job that tests the tree and is
  # missing from `needs` would let a red tree record that proof.
  verify:
    name: Typecheck, tests and build
    needs: [tests, build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Read the tested tree
        id: tree
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse 'HEAD^{tree}' > tested-tree
          echo "sha=$(cat tested-tree)" >> "$GITHUB_OUTPUT"

      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ steps.tree.outputs.sha }}
          path: tested-tree
          if-no-files-found: error
          retention-days: 30
          # A re-run of a green PR run uploads the same name again.
          overwrite: true
