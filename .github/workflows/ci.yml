name: CI

on:
  # CI en pausa desde 2026-09-17 por dos motivos: las comprobaciones de PR
  # eran lentas, y el E2E estaba roto. El segundo motivo YA NO APLICA: el E2E
  # fallaba porque el harness buscaba un chip que el issue #17 habia retirado,
  # y eso se arreglo en esta misma tanda (issue #16).
  #
  # Los disparadores siguen comentados a proposito, no por olvido: falta
  # comprobar en un runner real que `livekit-server --dev` con `--network
  # host` reune candidatos ICE alcanzables, algo que solo demuestra un
  # `workflow_dispatch` de verdad. Para reactivar: lanzar la CI a mano, y tras
  # tres corridas verdes seguidas descomentar los dos disparadores de abajo.
  # Si la duracion empeora de forma apreciable, no reactivar y decidir aparte.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

# Una ejecucion por rama: un push nuevo cancela el anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La version de pnpm sale del campo packageManager de package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # La capa `browser` corre contra Chromium real: Phaser no se puede ni
      # importar bajo jsdom, asi que sin este navegador esa capa no existe.
      - name: Install Chromium for the browser test layer
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      # Tres capas: `unit` (jsdom), `server` (Node, levanta un Colyseus real en
      # un puerto efimero) y `browser` (Chromium). `test:all` corre las tres.
      - name: Tests (jsdom + Node + Chromium)
        run: pnpm test:all

      # Pruebas puras del arnes E2E (extraccion de la URL de `vite preview`).
      # Van antes de los builds a proposito: no necesitan bundle y cuestan
      # milisegundos, asi que un arnes roto se ve en el minuto 1 y no tras los
      # dos builds y diez escenarios de navegador.
      - name: Harness unit tests
        run: pnpm test:harness

      - name: Build
        run: pnpm build

      # Segundo build, solo para el arnes E2E: expone el hook de test-only
      # detras de un flag (`__OFFICE_E2E__`), el `dist` de arriba se queda
      # limpio y sirve de control negativo.
      - name: Build the instrumented E2E bundle
        run: pnpm build:e2e

      # Dos clientes reales de Chromium contra Colyseus real y `vite preview`
      # real; LiveKit va sin credenciales a proposito (D6), asi que esta capa
      # no necesita Docker.
      #
      # No se desactiva el color: con `CI` definido vite colorea su banner
      # (issue #22), y dejarlo asi hace que este paso ejercite de verdad la ruta
      # con secuencias ANSI en vez de esconderla detras de `NO_COLOR`.
      # El plazo sube a 30s porque un runner frio arranca `node` y `vite` mas
      # despacio que una maquina local; el arnes usa 15s por defecto.
      - name: Two-client E2E (Colyseus + preview, no LiveKit)
        run: pnpm test:e2e
        env:
          E2E_READINESS_TIMEOUT_MS: 30000

      # D7: `--network host` puts the SFU and this same runner process in one
      # network namespace. `use_external_ip: false` (`infra/livekit/livekit.yaml`)
      # makes LiveKit advertise ICE candidates that are only reachable this way
      # on a GitHub-hosted runner -- a bridged `docker compose` network or the
      # unmodified `services:` block would advertise an address Chromium can
      # never actually reach (obs #562 Q3). Same digest-pinned image as
      # `infra/livekit/docker-compose.yml:25`, one version-pin surface.
      - name: Start a real LiveKit server for the audio E2E gate
        run: |
          docker run -d --network host --name ci-livekit \
            livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1 \
            --dev

      # `--dev` mints its own fixed `devkey`/`secret` pair -- never a real
      # secret, so no GitHub Secret is needed. Written to the already
      # gitignored `.gitignore:11-15` path; deleted again in the cleanup step
      # below regardless of job outcome.
      - name: Write ephemeral LiveKit credentials for the audio E2E gate
        run: |
          cat > infra/livekit/.env <<'EOF'
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=secret
          LIVEKIT_URL=ws://localhost:7880
          EOF

      # Blocking, never `continue-on-error` (D9): an advisory gate cannot
      # fail, which is the exact vacuity this change exists to remove -- and
      # it already caught a real product bug (obs #570) this way. The harness
      # itself gates on a real readiness probe (`livekitHealthUrl`) before
      # opening any browser context, so this step needs no extra wait.
      - name: Two-client audio E2E (real LiveKit, both arrival orders)
        run: pnpm test:e2e:audio
        env:
          VITE_LIVEKIT_E2E: 1
          E2E_READINESS_TIMEOUT_MS: 30000

      - name: Stop the real LiveKit server and drop its credentials
        if: always()
        run: |
          docker rm -f ci-livekit || true
          rm -f infra/livekit/.env
