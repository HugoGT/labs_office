name: Deploy (test)

# Separado de ci.yml a proposito: ci.yml verifica y no publica nada, y tiene
# que seguir corriendo en los pull requests de forks sin ninguna credencial.
# Este workflow toca infraestructura y solo corre sobre main.
on:
  # Despliegue automatico reactivado el 2026-09-21, y NO con `push` a secas.
  #
  # `push: [main]` habria lanzado este workflow EN PARALELO con ci.yml, que
  # tambien corre en cada push a main: las imagenes se publicarian y la VM se
  # actualizaria sin esperar al veredicto de los tests. El unico freno seria el
  # smoke check final, y ese solo ve si /health contesta 200, no si una prueba
  # unitaria se puso roja.
  #
  # `workflow_run` invierte el orden: este workflow no arranca hasta que la CI
  # TERMINA, y el `if` del job de abajo lo descarta salvo que haya terminado en
  # verde. Un commit rojo en main no llega nunca a la maquina.
  #
  # Dos consecuencias de `workflow_run` que conviene tener presentes:
  #
  #   1. GitHub solo atiende este disparador con la version del fichero que hay
  #      en la rama por defecto. Este cambio no surte efecto hasta que aterriza
  #      en main; probarlo desde la rama del PR no dispara nada.
  #   2. El checkout por defecto seria la punta de main, no el commit que la CI
  #      verifico. Por eso todo lo de abajo resuelve el SHA desde
  #      `workflow_run.head_sha` y nunca desde `github.sha`, que aqui apunta al
  #      commit del disparador y no al que se esta desplegando.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Sin cancel-in-progress: un despliegue a medias deja la VM con imagenes
# nuevas y contenedores viejos. Los despliegues hacen cola, no se matan.
concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  # Necesario para que GitHub emita el token OIDC con el que GCP nos identifica.
  # Es lo que sustituye a una clave JSON de cuenta de servicio guardada como
  # secreto: aquella no caduca nunca y quien la lea una vez la tiene para
  # siempre.
  id-token: write

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # El filtro que convierte "la CI acabo" en "la CI acabo bien". Las tres
    # condiciones son necesarias y ninguna sobra:
    #
    #   - `conclusion == 'success'`: `workflow_run`/`completed` tambien salta
    #     con la CI en rojo, cancelada o saltada. Sin esto desplegariamos justo
    #     los commits que no hay que desplegar.
    #   - `head_branch == 'main'`: el `branches:` del disparador ya filtra, pero
    #     repetirlo aqui hace que el job explique su propia condicion y no
    #     dependa de leer el bloque `on:`.
    #   - `event == 'push'`: descarta las corridas de CI de los pull requests.
    #     Importa de verdad con los forks: un PR desde una rama llamada `main`
    #     traeria `head_branch == 'main'` sin haberse fusionado nada.
    #
    # La primera rama del `or` conserva el `gh workflow run deploy-test.yml` de
    # siempre, que sigue siendo la via para redesplegar sin tocar codigo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')

    env:
      REGISTRY: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
      REPOSITORY: ${{ vars.GCP_AR_REPOSITORY || 'labs-office-test' }}
      INSTANCE: ${{ vars.GCP_INSTANCE || 'labs-office-test' }}
      ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
      APP_HOST: ${{ vars.APP_HOST }}
      # El commit que se despliega, y la unica fuente de verdad para el tag de
      # las tres imagenes y para el argumento de `office-deploy`.
      #
      # Por `workflow_run` vale el SHA que la CI verifico; por
      # `workflow_dispatch` ese campo no existe y cae a `github.sha`, que
      # entonces SI es el commit elegido a mano. Escrito una sola vez arriba
      # para que no haya forma de que una de las cuatro referencias de abajo se
      # quede apuntando a otro commit.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # `ref` explicito: sin el, `workflow_run` haria checkout de la punta de
      # main, que puede haber avanzado desde que la CI dio el visto bueno.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # APP_HOST se deriva de la IP estatica y lo fija una persona una sola vez
      # desde `terraform output` (ver infra/gcp/README.md). Fallar aqui, antes
      # de construir nada, es mucho mas barato que descubrirlo cuando el SPA ya
      # esta publicado apuntando al host equivocado.
      - name: Check the deploy variables are set
        run: |
          test -n "${APP_HOST}" || { echo "Falta la variable de repositorio APP_HOST"; exit 1; }
          test -n "${{ vars.GCP_PROJECT_ID }}" || { echo "Falta la variable GCP_PROJECT_ID"; exit 1; }
          test -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || { echo "Falta la variable GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "${{ vars.GCP_DEPLOYER_SA }}" || { echo "Falta la variable GCP_DEPLOYER_SA"; exit 1; }
          if [ -z "${{ vars.FIREBASE_API_KEY }}" ]; then
            echo "::warning::FIREBASE_API_KEY no está definida: el SPA se construye SIN pantalla de login (issue #8, ver infra/gcp/README.md)"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${REGISTRY}" --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Las imagenes se etiquetan con el SHA del commit, nunca con `latest`:
      # `latest` hace que no se pueda saber que corre en la VM ni volver a una
      # version anterior sin reconstruir.
      #
      # Imagen propia de Caddy con el modulo layer4 (issue #19). El arnes
      # local (`pnpm test:mux`) NO corre aqui: solo construye y publica la
      # imagen, igual que hace con `web` y `colyseus`.
      - name: Build and push the Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/gcp/docker/caddy.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/caddy:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Build and push the Colyseus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/gcp/docker/colyseus.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/colyseus:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=colyseus
          cache-to: type=gha,scope=colyseus,mode=max

      # VITE_COLYSEUS_URL se hornea en el bundle en tiempo de build: es la unica
      # forma de que el cliente hable wss://app.../ y no ws://<host>:2567, que
      # es lo que deduce solo y que no pasa por Caddy.
      #
      # Las tres VITE_FIREBASE_* viajan igual (issue #8). Son variables de
      # repositorio y no secretos: la apiKey de Firebase se publica en el bundle
      # por diseno y no autoriza nada por si sola.
      #
      # El project id va condicionado a que exista FIREBASE_API_KEY: su fallback a
      # GCP_PROJECT_ID lo dejaba SIEMPRE con valor, y entonces el Dockerfile veia
      # un project id sin api key y cortaba el build con "define las dos o
      # ninguna". Eso rompio todos los despliegues desde el #8 hasta aqui.
      #
      # Son OPCIONALES, igual que `auth_project_id` en Terraform: sin ellas el
      # SPA se construye sin pantalla de login, que es como corrio hasta el #8.
      # Exigirlas aqui dejaria el despliegue roto hasta que alguien diese de alta
      # Identity Platform, y encender la autenticacion tiene que ser un gesto
      # deliberado, no el precio de poder desplegar. Lo que el Dockerfile si
      # rechaza es definir una a medias.
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/gcp/docker/web.Dockerfile
          push: true
          build-args: |
            VITE_COLYSEUS_URL=wss://${{ env.APP_HOST }}
            VITE_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.FIREBASE_API_KEY && (vars.FIREBASE_PROJECT_ID || vars.GCP_PROJECT_ID) || '' }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
          tags: ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # El tag viaja como argumento hasta la VM; el fichero compose de alli lee
      # IMAGE_TAG de su .env y nadie lo edita a mano por SSH. Asi lo que corre
      # en la maquina es siempre reconstruible desde este repositorio.
      #
      # El tunel de IAP evita tener que abrir el 22 a internet: la VM solo
      # acepta SSH desde el rango de IAP y la autenticacion es la identidad
      # federada de este workflow, no una clave privada guardada en un secreto.
      # El script se refresca desde la metadata ANTES de correrlo, y no es
      # paranoia: `/usr/local/bin/office-deploy` solo se escribe en el arranque
      # de la VM (ver startup-script.sh), asi que un `terraform apply` que
      # cambie el script deja la copia del disco vieja hasta el siguiente
      # reinicio. El fichero compose, en cambio, se lee de la metadata en cada
      # despliegue. Esa pareja descuadrada es exactamente lo que rompio el
      # despliegue del 2026-09-17: compose nuevo con Postgres, script viejo que
      # no sabia escribir sus variables, y la base arrancando sin contrasena.
      - name: Deploy over the IAP tunnel
        run: |
          gcloud compute ssh "${INSTANCE}" \
            --zone "${ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo curl -sS -f -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/attributes/office-deploy-script -o /usr/local/bin/office-deploy && sudo chmod 0755 /usr/local/bin/office-deploy && sudo /usr/local/bin/office-deploy ${{ env.DEPLOY_SHA }}"

      # Sin esto el workflow diria "desplegado" en cuanto docker compose
      # devuelve el control, que es antes de que ningun contenedor conteste.
      # Se golpea la ruta de salud real, por HTTPS y por el hostname publico:
      # cubre de una vez el certificado, Caddy, el enrutado y el servidor.
      - name: Smoke check
        run: |
          url="https://${APP_HOST}/health"
          echo "comprobando ${url}"

          # Hasta 20 intentos: en el primer despliegue Caddy todavia esta
          # negociando el certificado con Let's Encrypt y eso tarda decenas de
          # segundos.
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 10 "${url}" || echo 000)"
            if [ "${code}" = "200" ]; then
              echo "200 OK:"
              cat /tmp/health.json
              exit 0
            fi
            echo "intento ${attempt}: HTTP ${code}"
            sleep 15
          done

          echo "::error::/health nunca devolvio 200. Revisar: gcloud compute ssh ${INSTANCE} --zone ${ZONE} --tunnel-through-iap --command 'sudo docker compose --project-directory /opt/office logs --tail 100'"
          exit 1
